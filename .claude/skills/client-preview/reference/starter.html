<!doctype html>
<!--
  GES client-preview STARTER skeleton — DO NOT ship as-is. It already embodies
  the polish bar (editorial headers, condensing nav w/ animated underlines,
  hover-accent cards, staggered scroll-reveal, count-up, scroll-progress).
  Replace every {{TOKEN}}, derive the palette/type from the business, write real
  copy, add the rich sections + signature interaction. Keep it ONE page; inline
  everything; relative/inline assets only.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{BUSINESS}} — {{TAGLINE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ---- brand tokens: DERIVE from the business ---- */
    :root{
      --ink:#16130f; --paper:#f7f3ec; --accent:#c8552b; --accent-2:#2f6f4f;
      --muted:#6b6258; --line:#e6ddcd;
      --display:"Fraunces",Georgia,serif; --sans:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
      --ease:cubic-bezier(.22,.61,.36,1);
      --pad: clamp(72px,10vw,132px);  /* section rhythm */
    }
    *{margin:0;box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:80px}
    body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.04;letter-spacing:-.015em}
    a{color:inherit;text-decoration:none} svg{display:block} img{max-width:100%;display:block}
    .wrap{max-width:1160px;margin:0 auto;padding:0 clamp(22px,5vw,56px)}
    section{padding:var(--pad) 0}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

    /* editorial section header */
    .eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:11px;text-transform:uppercase;letter-spacing:.32em;color:var(--accent);font-weight:600}
    .eyebrow::before{content:"";width:30px;height:1px;background:var(--accent-2);opacity:.85}
    .head{max-width:680px;margin-bottom:56px}
    .head h2{font-size:clamp(2.3rem,5.2vw,4rem);margin:18px 0 0;letter-spacing:-.02em;line-height:1.02}
    .head .kicker{margin-top:18px;color:var(--muted);font-size:1.05rem;max-width:48ch}

    /* scroll progress */
    .prog{position:fixed;left:0;top:0;height:2px;background:var(--accent);z-index:70;width:0}

    /* nav — sticky + condensing + animated underline */
    .nav{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
      padding:18px clamp(22px,5vw,56px);background:color-mix(in srgb,var(--paper) 80%,transparent);
      backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:padding .3s var(--ease),border-color .3s,box-shadow .3s}
    .nav.stuck{padding-top:10px;padding-bottom:10px;border-bottom-color:var(--line);box-shadow:0 12px 30px -26px rgba(0,0,0,.5)}
    .brand{font-family:var(--display);font-weight:600;font-size:20px;display:flex;align-items:center;gap:10px}
    .links{display:flex;align-items:center;gap:28px}
    .links a:not(.cta){position:relative;font-size:13px;letter-spacing:.08em;color:var(--ink);opacity:.68;transition:opacity .25s}
    .links a:not(.cta):hover{opacity:1}
    @media(min-width:821px){
      .links a:not(.cta)::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1.5px;background:var(--accent);transition:right .35s var(--ease)}
      .links a:not(.cta):hover::after{right:0}
    }
    .cta{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:11px 22px;border-radius:100px;background:var(--ink);color:var(--paper);transition:all .3s var(--ease)}
    .cta:hover{transform:translateY(-2px)}
    .navTog{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:8px}
    .navTog span{width:24px;height:2px;background:var(--ink)}
    @media(max-width:820px){
      .links{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--paper);border-bottom:1px solid var(--line);padding:8px clamp(22px,5vw,56px) 18px;transform:translateY(-130%);opacity:0;pointer-events:none;transition:.32s var(--ease)}
      .links.open{transform:none;opacity:1;pointer-events:auto}
      .links a:not(.cta){padding:13px 0;border-bottom:1px solid var(--line)} .links .cta{margin-top:12px;justify-content:center}
      .navTog{display:flex}
    }

    /* hero — a moment */
    .hero{position:relative;overflow:hidden;padding:clamp(76px,12vw,150px) 0 clamp(60px,9vw,110px)}
    .hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 60% at 84% 10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),radial-gradient(66% 66% at 6% 96%,color-mix(in srgb,var(--accent-2) 14%,transparent),transparent 60%)}
    .hero__in{position:relative;max-width:780px}
    .hero h1{font-size:clamp(3.2rem,9.5vw,7rem);margin:24px 0 26px;letter-spacing:-.02em}
    .hero p{font-size:clamp(1.1rem,2.1vw,1.4rem);color:var(--muted);max-width:560px;margin-bottom:34px}
    .stats{display:flex;flex-wrap:wrap;gap:30px;margin-top:50px;padding-top:28px;border-top:1px solid var(--line)}
    .stats dt{font-family:var(--display);font-size:2rem;color:var(--accent);line-height:1}
    .stats dd{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}

    /* cards with life */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:34px 28px;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .4s}
    .card::before{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .45s var(--ease)}
    .card:hover{transform:translateY(-7px);border-color:transparent;box-shadow:0 36px 70px -40px rgba(0,0,0,.45)}
    .card:hover::before{width:100%}

    /* choreographed reveal (stagger via --i on each .reveal) */
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0)*80ms)}
    .reveal.in{opacity:1;transform:none}

    @media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}
    @media(max-width:540px){.grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{opacity:1;transform:none;transition:none}.card:hover{transform:none}}
  </style>
</head>
<body id="top">
  <div class="prog" id="prog" aria-hidden="true"></div>
  <header class="nav" id="nav">
    <a class="brand" href="#top">{{BUSINESS}}</a>
    <nav class="links" id="links" aria-label="Primary">
      <a href="#offer">{{NAV_1}}</a><a href="#story">{{NAV_2}}</a><a href="#contact">{{NAV_3}}</a>
      <a class="cta" href="#contact">{{PRIMARY_CTA}}</a>
    </nav>
    <button class="navTog" id="navTog" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
  </header>

  <main>
    <section class="hero">
      <div class="wrap hero__in reveal">
        <p class="eyebrow">{{CITY}} · {{POSITIONING}}</p>
        <h1>{{HEADLINE}}</h1>
        <p>{{SUBHEAD}}</p>
        <a class="cta" href="#contact">{{PRIMARY_CTA}}</a>
        <dl class="stats">
          <div><dt><span class="count" data-count="0">0</span></dt><dd>{{STAT_1}}</dd></div>
        </dl>
      </div>
    </section>

    <!-- Build the rich sections here: offering (cards, stagger via style="--i:0/1/2"),
         gallery+lightbox, story, process, social-proof-or-trust, pricing, FAQ, CTA. -->
    <section id="offer"><div class="wrap">
      <div class="head reveal"><p class="eyebrow">{{KICKER_LABEL}}</p><h2>{{OFFER_HEADING}}</h2><p class="kicker">{{OFFER_KICKER}}</p></div>
      <div class="grid">
        <article class="card reveal" style="--i:0"><!-- icon + h3 + copy --></article>
        <article class="card reveal" style="--i:1"></article>
        <article class="card reveal" style="--i:2"></article>
      </div>
    </div></section>
    <section id="story"><div class="wrap"><div class="head reveal"><p class="eyebrow">{{NAV_2}}</p><h2>{{STORY_HEADING}}</h2></div></div></section>
    <section id="contact"><div class="wrap"><div class="head reveal"><p class="eyebrow">Get in touch</p><h2>{{CTA_HEADING}}</h2></div><!-- form + real phone/email --></div></section>
  </main>

  <footer class="wrap" style="padding-top:40px;padding-bottom:40px;color:var(--muted);font-size:13px">© <span id="yr"></span> {{BUSINESS}} · preview by GES</footer>

  <script>
    (function(){
      var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      document.getElementById('yr').textContent=new Date().getFullYear();
      // staggered scroll reveal
      var els=document.querySelectorAll('.reveal');
      if('IntersectionObserver'in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -40px 0px'});els.forEach(function(el){io.observe(el)});}
      else els.forEach(function(el){el.classList.add('in')});
      // count-up
      function cu(el){var to=+el.dataset.count,pre=el.dataset.prefix||'',suf=el.dataset.suffix||'';if(reduce){el.textContent=pre+to.toLocaleString()+suf;return;}var t0=performance.now();(function t(n){var p=Math.min(1,(n-t0)/1200),e=1-Math.pow(1-p,3);el.textContent=pre+Math.round(to*e).toLocaleString()+suf;if(p<1)requestAnimationFrame(t)})(t0);}
      var c=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){cu(e.target);c.unobserve(e.target)}})},{threshold:.5});document.querySelectorAll('.count').forEach(function(el){c.observe(el)});
      // sticky nav + progress
      var nav=document.getElementById('nav'),prog=document.getElementById('prog');
      function s(){nav.classList.toggle('stuck',scrollY>20);var h=document.documentElement,m=h.scrollHeight-h.clientHeight;prog.style.width=(m>0?scrollY/m*100:0)+'%';}
      addEventListener('scroll',s,{passive:true});s();
      // mobile menu
      var t=document.getElementById('navTog'),l=document.getElementById('links');
      t.addEventListener('click',function(){var o=l.classList.toggle('open');t.setAttribute('aria-expanded',o)});
      l.addEventListener('click',function(e){if(e.target.tagName==='A'){l.classList.remove('open');t.setAttribute('aria-expanded',false)}});
    })();
  </script>
</body>
</html>
