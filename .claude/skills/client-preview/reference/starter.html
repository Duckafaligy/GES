<!doctype html>
<!--
  GES client-preview STARTER skeleton — DO NOT ship as-is.
  Single, self-contained landing page (inline CSS + JS, inline SVG logo).
  Replace every {{TOKEN}}, swap the palette/type/sections to fit the business,
  and write real copy. Keep it ONE page. Relative/inline assets only.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{BUSINESS}} — {{TAGLINE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Pick fonts that fit the brand; keep a system fallback in the stack below. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ---- brand tokens: DERIVE these from the business ---- */
    :root{
      --ink:#15130f; --paper:#f7f3ec; --accent:#c8552b; --accent-2:#2f6f4f;
      --muted:#6b6258; --line:#e3dac9;
      --display:"Fraunces",Georgia,serif;
      --sans:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
      --ease:cubic-bezier(.22,.61,.36,1);
    }
    *{margin:0;box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:80px}
    body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    h1,h2,h3{font-family:var(--display);line-height:1.04;letter-spacing:-.015em;font-weight:600}
    a{color:inherit;text-decoration:none}
    img,svg{display:block;max-width:100%}
    .wrap{max-width:1140px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

    /* nav */
    .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
      padding:14px clamp(20px,5vw,48px);background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:18px}
    .nav nav{display:flex;gap:24px}
    .nav nav a{font-size:14px;color:var(--muted)}
    .nav nav a:hover{color:var(--ink)}
    .btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:13px 24px;border-radius:100px;cursor:pointer;transition:transform .25s var(--ease),background .25s}
    .btn--solid{background:var(--ink);color:var(--paper)}
    .btn--solid:hover{transform:translateY(-2px)}

    /* hero — make this striking + specific to the business */
    .hero{position:relative;padding:clamp(72px,12vw,150px) 0 clamp(56px,9vw,110px);overflow:hidden}
    .hero::before{content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 55%)}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);font-weight:600}
    .hero h1{font-size:clamp(2.8rem,8vw,6rem);margin:18px 0 22px}
    .hero p{font-size:clamp(1.05rem,1.9vw,1.3rem);max-width:600px;color:var(--muted);margin-bottom:32px}

    /* generic section + reveal */
    section{padding:clamp(56px,9vw,110px) 0}
    .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
    .reveal.in{opacity:1;transform:none}

    .foot{background:var(--ink);color:var(--paper);padding:clamp(40px,6vw,64px) 0;font-size:14px}

    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .reveal{opacity:1;transform:none;transition:none}
    }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" aria-label="{{BUSINESS}} home">
      <!-- inline SVG logo/monogram derived from the brand -->
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><circle cx="16" cy="16" r="8" fill="var(--accent)"/></svg>
      {{BUSINESS}}
    </a>
    <nav aria-label="Primary">
      <a href="#offer">{{NAV_1}}</a>
      <a href="#story">{{NAV_2}}</a>
      <a href="#contact">{{NAV_3}}</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap reveal">
        <p class="eyebrow">{{CITY}} · {{POSITIONING}}</p>
        <h1>{{HEADLINE}}</h1>
        <p>{{SUBHEAD}}</p>
        <a class="btn btn--solid" href="#contact">{{PRIMARY_CTA}}</a>
      </div>
    </section>

    <!-- Swap/extend these to fit the business: offering, story, proof, CTA -->
    <section id="offer"><div class="wrap reveal"><h2>{{OFFER_HEADING}}</h2><!-- product/collection cards, brand-tone gradients --></div></section>
    <section id="story"><div class="wrap reveal"><h2>{{STORY_HEADING}}</h2><!-- the why-them narrative --></div></section>
    <section id="contact"><div class="wrap reveal"><h2>{{CTA_HEADING}}</h2><!-- booking/order/enquiry + real phone/email --></div></section>
  </main>

  <footer class="foot"><div class="wrap">© <span id="yr"></span> {{BUSINESS}} · preview built by GES</div></footer>

  <script>
    (function(){
      // footer year
      var y=document.getElementById('yr'); if(y) y.textContent=new Date().getFullYear();
      // scroll reveal
      var els=document.querySelectorAll('.reveal');
      if('IntersectionObserver' in window){
        var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.12,rootMargin:'0px 0px -40px 0px'});
        els.forEach(function(el){io.observe(el)});
      } else { els.forEach(function(el){el.classList.add('in')}); }
    })();
  </script>
</body>
</html>
